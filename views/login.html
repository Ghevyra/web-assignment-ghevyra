<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Academic Archive</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <div class="card auth-container">
            <div style="text-align: center; margin-bottom: 1.75rem;">
                <div class="profile-avatar-3d" style="width: 80px; height: 80px; border-radius: 50%; overflow: hidden; margin: 0 auto 1rem auto; box-shadow: 4px 4px 0px #1e1e1e; border: 3px solid #1e1e1e;">
                    <img src="/images/ghevyra.jpg" alt="Ghevyra" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <h2 style="color: var(--text-main, #1e1e1e); font-weight: 800; font-size: 1.6rem; letter-spacing: -0.5px;">Ghevyra Nur Fadilah</h2>
                <p style="color: var(--text-muted, #666); font-size: 0.92rem; margin-top: 0.3rem;">Academic Archive</p>
            </div>

            <div id="alertBox" class="alert alert-danger hidden"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control" required placeholder="Masukkan username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required placeholder="Masukkan password">
                </div>
                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Masuk Dashboard</button>
            </form>

            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                Belum punya akun? <a href="/register" style="color: var(--primary, #06d6a0); text-decoration: none; font-weight: 700;">Register di sini</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            alertBox.classList.add('hidden');
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/dashboard';
                } else {
                    alertBox.textContent = data.message;
                    alertBox.classList.remove('hidden');
                }
            } catch (err) {
                alertBox.textContent = 'Terjadi kesalahan pada server.';
                alertBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
